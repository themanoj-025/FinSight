<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" role="img" aria-label="FinSight Agent">
  <!-- Slate rounded tile with candlestick chart (up = green, down = red) -->
  <rect x="4" y="10" width="100" height="100" rx="20" fill="#1E293B"/>
  <line x1="30" y1="28" x2="30" y2="76" stroke="#22C55E" stroke-width="3"/>
  <rect x="25" y="40" width="10" height="24" rx="2" fill="#22C55E"/>
  <line x1="50" y1="22" x2="50" y2="66" stroke="#EF4444" stroke-width="3"/>
  <rect x="45" y="32" width="10" height="22" rx="2" fill="#EF4444"/>
  <line x1="70" y1="34" x2="70" y2="92" stroke="#22C55E" stroke-width="3"/>
  <rect x="65" y="48" width="10" height="30" rx="2" fill="#22C55E"/>
  <line x1="90" y1="26" x2="90" y2="70" stroke="#22C55E" stroke-width="3"/>
  <rect x="85" y="36" width="10" height="22" rx="2" fill="#22C55E"/>
  <!-- Wordmark — lightened for dark backgrounds -->
  <text x="130" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#E2E8F0" letter-spacing="1">FinSight</text>
  <text x="132" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#9CA3AF" letter-spacing="2.5">AUTONOMOUS FINANCE AGENT</text>
</svg>
